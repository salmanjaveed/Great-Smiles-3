function Btn({children, variant='primary', onClick, style={}, small=false}){

    border:'none',fontFamily:'Inter,sans-serif',fontWeight:600,

    primary:{background:hov?C.redLight:C.red,color:C.white,boxShadow:hov?'0 8px 25px rgba(204,34,41,0.4)':'0 4px 15px rgba(204,34,41,0.25)',transform:hov?'translateY(-2px)':'none'},

  };
  return <button onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={onClick} style={{...base,...sizes,...variants[variant],...style}}>{children}</button>;
}

function useCountUp(target, duration=2200, inView=false){
  const [val,setVal]=useState(0);
  useEffect(()=>{
    if(!inView)return;
    // Tick-based: updates every ~40ms for a visible "clicking" effect
    const ticks=duration/40;
    let tick=0;
    const id=setInterval(()=>{
      tick++;
      const p=Math.min(tick/ticks,1);
      const ease=1-Math.pow(1-p,4);
      setVal(Math.floor(ease*target));
      if(p>=1)clearInterval(id);
    },40);
    return()=>clearInterval(id);
  },[inView,target,duration]);
  return val;
}

function StatItem({n,label}){
  const ref=useRef(null);
  const [inView,setInView]=useState(false);
  const [done,setDone]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setInView(true);obs.disconnect();}},{threshold:0.3});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  const match=n.match(/^([\d,]+)(\+|%)?$/);
  const numericTarget=match?parseInt(match[1].replace(',',''),10):null;
  const suffix=match?(match[2]||''):'';
  const count=useCountUp(numericTarget||0,2200,inView);
  useEffect(()=>{if(inView&&numericTarget!=null&&count>=numericTarget)setDone(true);},[count,inView,numericTarget]);
  const display=numericTarget!=null?(numericTarget>=1000?count.toLocaleString():count)+suffix:n;
  const counting=inView&&!done;
  return <div ref={ref} style={{textAlign:'center',padding:'16px 8px',transition:'transform 0.3s',transform:counting?'scale(1.06)':'scale(1)'}}>
    <div style={{
      fontFamily:'Playfair Display,serif',fontSize:'2.4rem',fontWeight:700,lineHeight:1,
      color:C.white,
      textShadow:counting?`0 0 20px rgba(255,255,255,0.5),0 0 40px rgba(255,200,200,0.3)`:'none',
      transition:'text-shadow 0.3s,font-size 0.2s',
      opacity:inView?1:0,
    }}>{display}</div>
    <div style={{fontSize:'13px',color:'rgba(255,255,255,0.65)',marginTop:'8px',fontWeight:500,letterSpacing:'0.02em'}}>{label}</div>
  </div>;
}

  // Apply tweaks
  useEffect(()=>{
    document.documentElement.style.setProperty('--red',tweaks.accentColor);
    document.documentElement.style.setProperty('--navy',tweaks.navyColor);
  },[tweaks.accentColor,tweaks.navyColor]);
  const navigate=p=>{setPage(p);window.scrollTo({top:0,behavior:'smooth'});};
  return <>
    <Header page={page} setPage={navigate} tweaks={tweaks}/>
    <main>
      {page==='home'&&<>
        <Hero setPage={navigate} headline={tweaks.heroHeadline}/>
        <TrustBar/>
        <InsuranceBar/>
        <AboutPreview setPage={navigate}/>
        <ServicesOverview setPage={navigate}/>
        <WhyChooseUs/>
        <MeetDentist/>
        <Testimonials/>
        {tweaks.showPricing&&<Pricing setPage={navigate}/>}
        <CTASection setPage={navigate}/>
        <ContactPreview setPage={navigate}/>
      </>}
      {page==='about'&&<AboutPage setPage={navigate}/>}
      {page==='services'&&<ServicesPage setPage={navigate}/>}
      {page==='book'&&<BookPage/>}
      {page==='contact'&&<ContactPage/>}
    </main>
    <Footer setPage={navigate}/>
    <TweaksPanel>
      <TweakSection title="Brand Colors">
        <TweakColor id="accentColor" label="Accent Red" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
        <TweakColor id="navyColor" label="Primary Navy" value={tweaks.navyColor} onChange={v=>setTweak('navyColor',v)}/>
      </TweakSection>
      <TweakSection title="Hero">
        <TweakText id="heroHeadline" label="Headline" value={tweaks.heroHeadline} onChange={v=>setTweak('heroHeadline',v)}/>
      </TweakSection>
      <TweakSection title="Sections">
        <TweakToggle id="showPricing" label="Show Pricing Section" value={tweaks.showPricing} onChange={v=>setTweak('showPricing',v)}/>
      </TweakSection>
    </TweaksPanel>
  </>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
